name: CI - Seguridad (secretos)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '31 4 * * 1'

jobs:
  secrets:
    name: 'Escaneo de secretos (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Binario OSS fijado — gitleaks-action@v2 exige licencia de pago.
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Escanear secretos
        run: ./gitleaks git --verbose --redact .

  # Sin job de dependencias: el servidor de comunidad es stdlib-only
  # (http.server + sqlite3) y el juego no tiene dependencias externas.
