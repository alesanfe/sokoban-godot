name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m py_compile server/*.py
      - name: ruff (linter Python)
        run: |
          pip install "ruff==0.16.*"
          ruff check server/
      - name: bandit (seguridad Python)
        run: |
          pip install bandit
          bandit -r server/ --quiet --severity-level medium
      - name: gdlint (GDScript)
        run: |
          pip install "gdtoolkit==4.*"
          gdlint scripts/ tests/ tools/

  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-prereleases: true
      # refrescar el class cache antes de compilar scripts sueltos
      - run: godot --headless --path . --import
      - run: godot --headless --path . -s res://tests/test_runner.gd
      - run: godot --headless --path . -s res://tests/test_rules.gd
      - run: godot --headless --path . -s res://tests/test_playthrough.gd
      - run: godot --headless --path . -s res://tests/test_e2e.gd
      - run: godot --headless --path . -s res://tests/test_ui.gd

  server-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m py_compile server/community_server.py
      # smoke: arranca, health, register, publish, feed
      - run: |
          python server/community_server.py --port 18765 --db /tmp/skm_ci.db &
          sleep 1.5
          curl -sf http://127.0.0.1:18765/api/health | grep -q '"ok": *true'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:18765/api/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"pw1234"}' | python -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          curl -sf -X POST http://127.0.0.1:18765/api/publish \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d '{"title":"ci","data":{"board":"#####\n#@$.#\n#####"},"moves":"r"}' | grep -q '"verified": *1'
          curl -sf "http://127.0.0.1:18765/api/feed?limit=1" | grep -q '"total": *1'
      - name: Unit tests de rutas (sin socket)
        run: python server/test_routes.py
      - name: Load test (concurrencia + consistencia de likes)
        run: python server/test_load.py

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:8.18.4 \
            detect --source=/repo --no-git -v
