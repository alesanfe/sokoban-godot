name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m py_compile server/*.py
      - name: ruff (linter Python)
        run: |
          pip install "ruff==0.16.*"
          ruff check server/
      - name: bandit (seguridad Python)
        run: |
          pip install bandit
          bandit -r server/ --quiet --severity-level medium
      - name: gdlint (GDScript)
        run: |
          pip install "gdtoolkit==4.*"
          gdlint scripts/ tests/ tools/

  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Descarga directa (mismo patrón que beliber): sin actions de
      # terceros — reproducible también bajo `act` local.
      - name: Descargar Godot 4.7.2 headless
        run: |
          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      # refrescar el class cache antes de compilar scripts sueltos
      - run: ./godot --headless --path . --import
      - run: ./godot --headless --path . -s res://tests/test_runner.gd
      - run: ./godot --headless --path . -s res://tests/test_rules.gd
      - run: ./godot --headless --path . -s res://tests/test_playthrough.gd
      - run: ./godot --headless --path . -s res://tests/test_e2e.gd
      - run: ./godot --headless --path . -s res://tests/test_ui.gd

  server-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m py_compile server/community_server.py
      # smoke: arranca, health, register, publish, feed
      - run: |
          python server/community_server.py --port 18765 --db /tmp/skm_ci.db &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:18765/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18765/api/health | grep -q '"ok": *true'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:18765/api/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-bot","password":"pw1234"}' | python -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          curl -sf -X POST http://127.0.0.1:18765/api/publish \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d '{"title":"ci","data":{"board":"#####\n#@$.#\n#####"},"moves":"r"}' | grep -q '"verified": *1'
          curl -sf "http://127.0.0.1:18765/api/feed?limit=1" | grep -q '"total": *1'
      - name: Unit tests de rutas (sin socket)
        run: python server/test_routes.py
      - name: Load test (concurrencia + consistencia de likes)
        # runners compartidos: margen extra sobre el presupuesto local
        env:
          SKM_P95_FEED_MS: "2000"
          SKM_P95_POST_MS: "5000"
        run: python server/test_load.py

  docs:
    # el README y docs/ son código — lint + enlaces rotos por PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md" "!docs/assets/**"
      - name: enlaces rotos (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude "localhost|127\.0\.0\.1|example\.com"
            "**/*.md"
          fail: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Binario OSS fijado — la imagen zricethezav/gitleaks:8.18.4 ya no
      # existe (manifest unknown) y gitleaks-action@v2 exige licencia.
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks git --verbose --redact .
